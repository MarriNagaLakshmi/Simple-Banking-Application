apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
      - name: bank-container
        image: shouryahd/bank-app:TAG_PLACEHOLDER
        stdin: true
        tty: true
---
apiVersion: v1
kind: Service
metadata:
  name: bank-service
spec:
  type: NodePort
  selector:
    app: bank
  ports:
  - port: 5000
    targetPort: 5000
